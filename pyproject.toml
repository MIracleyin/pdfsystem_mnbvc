[project]
name = "pdfsys-mnbvc"
version = "0.0.1"
description = "PB-scale PDF -> pretraining-data pipeline (MNBVC edition). Workspace root."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MNBVC Contributors" }]

# Root depends on every workspace package so that `uv sync` at the repo
# root installs the entire pipeline in one shot.
dependencies = [
    "pdfsys-core",
    "pdfsys-router",
    "pdfsys-layout-analyser",
    "pdfsys-parser-mupdf",
    "pdfsys-parser-pipeline",
    "pdfsys-parser-vlm",
    "pdfsys-bench",
    "pdfsys-cli",
    "opencv-python>=4.11.0.86",   # pin to non-headless variant; mineru requires it
]

[tool.uv.workspace]
members = ["packages/*", "external/parsers/packages/*"]

[tool.uv.sources]
pdfsys-core             = { workspace = true }
pdfsys-types            = { workspace = true }
pdfsys-router           = { workspace = true }
pdfsys-layout-analyser  = { workspace = true }
pdfsys-parser-mupdf     = { workspace = true }
pdfsys-parser-pipeline  = { workspace = true }
pdfsys-parser-vlm       = { workspace = true }
pdfsys-bench            = { workspace = true }
pdfsys-cli              = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pytest>=8.0",
    "jsonschema>=4.26.0",
]

[tool.hatch.build.targets.wheel]
# Root is a virtual meta-package — no source of its own.
bypass-selection = true

# ---- Ruff (linter + formatter) ----
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages/*/src"]
extend-exclude = [
    "external",   # a submodule; its lint belongs to its own repo, and fixes
                  # made here could not be committed anyway
    ".claude",    # agent worktrees and scratch, never part of a checkout
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

# RUF001-003 exist to catch homoglyph attacks — Cyrillic `а` wearing Latin
# `a`'s face. They keep doing that. What they must not do is flag the
# punctuation this codebase writes on purpose: docstrings, error messages and
# comments here are bilingual, and rewriting `，` to `,` would damage the
# Chinese rather than clarify it. The typographic characters are listed for
# the same reason — `×` in "4×4090" is the character that belongs there.
allowed-confusables = [
    "，", "（", "）", "：", "；", "。", "、", "！", "？",
    "–", "—", "−", "×", "“", "”", "‘", "’",
]

[tool.ruff.lint.isort]
known-first-party = [
    "pdfsys_core", "pdfsys_router", "pdfsys_layout_analyser",
    "pdfsys_parser_mupdf", "pdfsys_parser_pipeline", "pdfsys_parser_vlm",
    "pdfsys_bench", "pdfsys_cli",
]

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]

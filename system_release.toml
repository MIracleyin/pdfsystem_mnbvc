# pdfsys system release manifest.
# Owned by docs/superpowers/specs/2026-05-30-parsers-submodule-design.md (§5).
# Update via `pdfsys release lock` (rewrites `commit`, and relabels `tag` when
# the commit moves). Diff via `pdfsys release status`.
#
# `pdfsys release verify` is the gate that fails when a submodule HEAD differs
# from its pin. It is wired into .github/workflows/ci.yml, but that workflow
# does not currently run — so treat verify as a local pre-flight, not something
# that catches drift on your behalf.
#
# parsers is now an external submodule (Task 2.4 complete);
# quality-scorer remains in-tree (`repo = "in-tree:..."`) pending Spec #2.

[system]
version = "0.5.0"
released_at = "2026-08-29"
released_by = "miracleyin"
notes = "L2 packaging complete: both extraction lanes reach pdfsys.page/v2 (`pdfsys dataset --from-mineru` / `--from-pdf-dir`), validated by `dataset-validate` and re-emitted by `mnbvc-export`. Parsers at v0.3.0 — figure crops now return over HTTP, so --images crops works in the containerised deployment. uv.lock is in version control as of this release. Quality-scorer still in-tree pending Spec #2."

# `parsers` collectively refers to the four document-understanding packages
# plus the vendored pdfsys-types canonical type layer, all living in the
# external submodule at external/parsers/packages/:
#   - pdfsys-types (canonical type layer; zero-dep)
#   - pdfsys-parser-mupdf
#   - pdfsys-parser-pipeline
#   - pdfsys-parser-vlm
#   - pdfsys-layout-analyser
# Source: https://github.com/MIracleyin/pdfsys-parsers (public)
[components.parsers]
repo = "MIracleyin/pdfsys-parsers"
path = "external/parsers"
commit = "19b1b3398d9f72aea4a688c7a64ac7527d40fdb1"
tag = "v0.3.1"
schema_version = "extracted_doc.v1"

# quality-scorer component — currently in-tree at packages/pdfsys-bench.
# OcrQualityScorer / QualityScore live in pdfsys_bench.quality (+ quality_llm,
# quality_rules, _quality_server). Spec #2 will extract this to a dedicated repo
# with sealed-holdout governance.
[components.quality-scorer]
repo = "in-tree:packages/pdfsys-bench"
path = "packages/pdfsys-bench"
commit = "b1c3b46c9d39e1d2c615e158ec4b9bd3acb792e6"
tag = "in-tree-0.1.0"

[runtime]
# Informational pins — uv.lock is ground truth for Python deps.
mineru = "3.x"
python = "3.11+"

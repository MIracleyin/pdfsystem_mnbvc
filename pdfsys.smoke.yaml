# Phase-1 smoke test: 5 PDFs, full pipeline, MPS where supported.
# Goal: prove mineru installs, MPS works, parquet writes.

stages:
  - router
  - layout
  - extract
  - quality
  - parquet

input:
  pdf_dir: packages/pdfsys-bench/omnidocbench_100/pdfs
  limit: 5

output:
  dir: ./out/e2e_smoke
  jsonl: results.jsonl
  markdown_dir: markdown
  cache_dir: .cache

router:
  ocr_threshold: 0.5
  weights: null

layout:
  model: juliozhao/DocLayout-YOLO-DocStructBench
  backend: null
  conf_threshold: 0.25
  iou_threshold: 0.45
  render_dpi: 200

pipeline:
  formula_enable: true
  table_enable: true
  p_lang: ch

vlm:
  engine: mlx-engine       # Apple Silicon; use transformers on Linux/Intel, vllm-engine on NVIDIA
  enabled: true
  formula_enable: true
  table_enable: true
  p_lang: ch

quality:
  enabled: true
  model: HuggingFaceFW/finepdfs_ocr_quality_classifier_eng_Latn
  max_tokens: 512
  device: mps

parquet:
  enabled: true
  out: dataset.parquet
  compression: zstd
  quality_threshold: 2.0
  include_markdown: true

runtime:
  omp_threads: 1

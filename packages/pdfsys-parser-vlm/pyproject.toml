[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfsys-parser-vlm"
version = "0.2.0"
description = "VLM backend: out-of-process HTTP client to mineru-api (vlm-<engine>)."
requires-python = ">=3.11"
dependencies = [
    "pdfsys-core",
    "httpx>=0.27",
    "mineru[vlm]>=3.1,<4.0",
    # MLX extras only on Apple Silicon — gives ~3x speedup vs transformers
    # backend. On Intel Mac / Linux this entry is a no-op.
    "mineru[mlx]>=3.1,<4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
pdfsys-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pdfsys_parser_vlm"]

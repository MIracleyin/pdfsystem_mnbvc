[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfsys-parser-vlm"
version = "0.2.0"
description = "VLM backend: out-of-process HTTP client to mineru-api (vlm-<engine>)."
requires-python = ">=3.11"
dependencies = [
    "pdfsys-core",
    "httpx>=0.27",
    "mineru[vlm]>=3.1,<4.0",
]

[tool.uv.sources]
pdfsys-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pdfsys_parser_vlm"]

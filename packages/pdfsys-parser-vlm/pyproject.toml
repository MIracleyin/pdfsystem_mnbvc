[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfsys-parser-vlm"
version = "0.0.1"
description = "VLM backend: thin wrapper around mineru.cli.common.do_parse(backend='vlm-<engine>')."
requires-python = ">=3.11"
dependencies = [
    "pdfsys-core",
    "pymupdf>=1.25",
    "mineru[vlm]>=3.1,<4.0",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[tool.uv.sources]
pdfsys-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pdfsys_parser_vlm"]

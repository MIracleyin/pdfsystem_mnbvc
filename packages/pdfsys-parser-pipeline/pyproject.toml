[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfsys-parser-pipeline"
version = "0.2.0"
description = "OCR pipeline backend: out-of-process HTTP client to mineru-api (pipeline)."
requires-python = ">=3.11"
dependencies = [
    "pdfsys-core",
    "httpx>=0.27",
    "mineru[pipeline]>=3.1,<4.0",
]

[tool.uv.sources]
pdfsys-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pdfsys_parser_pipeline"]
